<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | CampusCare</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">CampusCare</a>
    <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="register.html">Create account</a></nav>
  </header>
  <main class="auth-wrap">
    <form class="auth-card" id="login-form" novalidate>
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in</h1>
      <p class="muted">Use your student or administrator demo account.</p>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="form-message" id="login-message" role="alert"></p>
      <button class="button full-width" type="submit">Sign in</button>
      <p class="auth-switch">New student? <a href="register.html">Create an account</a></p>
    </form>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
